pre-commit:
  jobs:
    - name: format qml
      run: cd "$(git rev-parse --show-toplevel)/packages/nosdshell" && ./Scripts/dev/qmlfmt.sh && git update-index --again
    - name: build settings search index
      run: cd "$(git rev-parse --show-toplevel)/packages/nosdshell" && python3 Scripts/test/build-settings-search-index.py && git add Assets/settings-search-index.json
