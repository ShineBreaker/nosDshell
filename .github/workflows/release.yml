name: release theme artifacts

# 打 tag 时产出可分发的安装包（PLAN §6.5：deb / rpm / tar.gz 三样）：
#   nosd-theme-<tag>.tar.gz          —— 供 make install PREFIX=/usr 的手工安装
#   nosd-theme_<tag>-1_all.deb       —— Debian/Ubuntu/deepin
#   nosd-theme-<tag>-1.noarch.rpm    —— Fedora/openSUSE 系
on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install build deps
        # debhelper 是 debian/control 的 Build-Depends，缺它 dpkg-buildpackage 直接 unmet。
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev devscripts debhelper fakeroot rpm

      - name: make tarball
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # 用 git archive 而不是 tar 目录：只取受版本控制的文件，
          # 避免把 arch/pkg/ 之类的本地构建产物打进发布包。
          git archive --format=tar.gz -o "dist/nosd-theme-${VERSION}.tar.gz" HEAD

      - name: build deb
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          # changelog 里已有该版本条目时 dch 会失败，跳过即可；版本以 tag 为准。
          dch -v "${VERSION}-1" "CI build ${GITHUB_REF_NAME}" || true
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          cp ../nosd-theme_*.deb dist/

      - name: build rpm
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          TOP="$PWD/dist/rpmbuild"
          mkdir -p "$TOP/SOURCES"
          # spec 的 Version: 是字面量，--define "version" 覆盖不了（实测仍走
          # BUILD/nosd-theme-0.1.0-build 并找 0.1.0 的源包），必须改文件本身。
          sed -i "s/^Version:.*/Version: ${VERSION}/" rpm/nosd-theme.spec
          git archive --format=tar.gz --prefix="nosd-theme-${VERSION}/" \
            -o "$TOP/SOURCES/nosd-theme-${VERSION}.tar.gz" HEAD
          rpmbuild -bb \
            --define "_topdir $TOP" \
            --define "_sourcedir $TOP/SOURCES" \
            rpm/nosd-theme.spec
          cp "$TOP"/RPMS/noarch/*.rpm dist/

      - name: list artifacts
        run: ls -l dist/

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
