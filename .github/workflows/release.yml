name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)publish, e.g. v1.1.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # release notes need full history and tags

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          base=$(grep -oP 'baseVersion:\s*"\K[^"]+' Commons/Version.qml)
          dev=$(grep -oP 'isDevelopment:\s*\K\w+' Commons/Version.qml)
          scm=$(sed -n '/name "nosdshell"/,/version/p' nosdshell.scm | grep -oP 'version "\K[^"]+' | head -1)
          flake=$(grep -oP 'version = "\K[^"]+(?=_" \+)' flake.nix)
          nixpkg=$(grep -oP 'version \? "\K[^"]+' nix/package.nix | head -1)
          wrap=$(grep -oP 'nosdshell v\K[0-9.]+' nosdshell.scm | head -1)
          printf 'base=%s dev=%s scm=%s flake=%s nix=%s wrap=%s\n' "$base" "$dev" "$scm" "$flake" "$nixpkg" "$wrap"
          [ "$RELEASE_TAG" = "v$base" ] || { echo "tag $RELEASE_TAG != v$base (Commons/Version.qml)" >&2; exit 1; }
          [ "$dev" = "false" ] || { echo "isDevelopment=$dev on tagged commit — tag the release commit, not the reopen" >&2; exit 1; }
          [ "$scm" = "$base" ] || { echo "nosdshell.scm version $scm != $base" >&2; exit 1; }
          [ "$flake" = "$base" ] || { echo "flake.nix version $flake != $base" >&2; exit 1; }
          [ "$nixpkg" = "$base" ] || { echo "nix/package.nix version $nixpkg != $base" >&2; exit 1; }
          [ "$wrap" = "$base" ] || { echo "nosdshell.scm --version line $wrap != $base" >&2; exit 1; }

      - name: Create release archive
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p ../nosdshell-release
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.agents' \
            --exclude='references' \
            --exclude='docs' \
            --exclude='nix' \
            --exclude='flake.nix' \
            --exclude='flake.lock' \
            --exclude='result*' \
            ./ ../nosdshell-release/
          tar -C .. -czf "nosdshell-${RELEASE_TAG}.tar.gz" nosdshell-release/
          cp "nosdshell-${RELEASE_TAG}.tar.gz" nosdshell-latest.tar.gz
          tar -tzf "nosdshell-${RELEASE_TAG}.tar.gz" | wc -l | xargs echo "archive entries:"

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ver="${RELEASE_TAG#v}"
          # CHANGELOG section for this version is the release body (docs/RELEASE.md);
          # fall back to a commit list if the entry is missing.
          notes=$(awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" { f=1; next }
            /^## \[/ { f=0 }
            f' CHANGELOG.md)
          if [ -n "$notes" ]; then
            printf '# nosDshell %s\n\n' "$RELEASE_TAG" > release_notes.md
            printf '%s\n' "$notes" >> release_notes.md
          else
            prev_tag=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null \
              || git tag --sort=-version:refname | grep -vxF "$RELEASE_TAG" | head -n1 || true)
            range="${prev_tag:-$(git rev-list --max-parents=0 HEAD)}..${RELEASE_TAG}"
            printf '# nosDshell %s\n\n## Changes since %s\n\n' "$RELEASE_TAG" "${prev_tag:-project start}" > release_notes.md
            git log "$range" --pretty=format:"- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H))" >> release_notes.md
            printf '\n' >> release_notes.md
          fi
          head -20 release_notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          assets=("nosdshell-${RELEASE_TAG}.tar.gz" nosdshell-latest.tar.gz)
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            printf 'Release %s exists; refreshing notes and assets.\n' "$RELEASE_TAG"
            gh release edit "$RELEASE_TAG" --notes-file release_notes.md
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            exit 0
          fi
          gh release create "$RELEASE_TAG" --verify-tag --notes-file release_notes.md "${assets[@]}"

  # The tag is the only thing a release needs from a human: everything below is
  # mechanical bookkeeping that used to sit in Scripts/dev/release.sh and ran on
  # whichever machine cut the release.  Both jobs are idempotent — re-running
  # this workflow for an existing tag (workflow_dispatch) is a no-op.
  reopen:
    name: Reopen development
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Flip isDevelopment back on
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if grep -q 'isDevelopment: true' Commons/Version.qml; then
            echo "isDevelopment already true — nothing to reopen."
            exit 0
          fi
          sed -i 's/isDevelopment: false/isDevelopment: true/' Commons/Version.qml
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Commons/Version.qml
          git commit -m "chore(release): reopen development after ${RELEASE_TAG}"
          git push origin main

  # The pin bump itself lives in jeans: its updater already knows the shared
  # %nosdshell-version / %nosdshell-source layout and how to hash the tag, and
  # `--only nosdshell` keeps the rest of the channel out of the run.  This job
  # only asks for that workflow; jeans opens the PR with its own token.
  jeans-pr:
    name: Ask jeans to bump the pin
    needs: release
    runs-on: ubuntu-latest

    steps:
      # The cross-repo token cannot be referenced from a step `if`, so probe it
      # once and gate the next step on the value written to GITHUB_ENV.
      - name: Probe for the cross-repo token
        env:
          JEANS_TOKEN: ${{ secrets.JEANS_TOKEN }}
        run: |
          if [ -n "$JEANS_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_ENV"
          else
            echo "has_token=false" >> "$GITHUB_ENV"
            echo "::warning title=jeans PR skipped::JEANS_TOKEN is not set, so jeans was not asked to bump the pin. Add the token or bump it by hand (docs/RELEASE.md step 8)."
          fi

      - name: Dispatch the jeans release-pin workflow
        if: env.has_token == 'true'
        env:
          GH_TOKEN: ${{ secrets.JEANS_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh workflow run nosdshell-release.yml \
            --repo ShineBreaker/jeans \
            -f tag="$RELEASE_TAG"
          printf 'dispatched ShineBreaker/jeans nosdshell-release.yml for %s\n' "$RELEASE_TAG"
          echo "follow it with: gh run list --repo ShineBreaker/jeans --workflow=nosdshell-release.yml"
