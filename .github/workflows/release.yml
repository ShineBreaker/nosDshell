name: Release

# monorepo 组件独立发版（docs/adr/0001）：tag 前缀即组件名，一个提交可
# 携带多个 tag，每个 tag 只触发自己组件的流水线。
#
#   nosdshell-v1.7.7         → nosdshell-<v>.tar.gz + GitHub Release
#   nosd-gtk-theme-v0.3.0    → tar.gz + deb/rpm/pkg + GitHub Release
#   nosd-kvantum-theme-v0.1.0 → tar.gz + GitHub Release
#   fcitx5-theme-nosd-v1.2.0 → tar.gz + deb/pkg + GitHub Release
#
# ⚠️ 历史 `v*` tag（v1.7.5…v1.7.6.1，旧 nosDshell 布局）仍有效可引用，
#    但**新发版一律用 `<component>-v*`**；`v*` 不再触发本流水线。
# ⚠️ 一次 push 最多 3 个 tag，超出则全部 workflow 不触发——多组件同发
#    分批推或逐个推。
on:
  push:
    tags:
      - "nosdshell-v*"
      - "nosd-gtk-theme-v*"
      - "nosd-kvantum-theme-v*"
      - "fcitx5-theme-nosd-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "回填的 tag（须已存在于远端，形如 <component>-v<version>）"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ── 1. 判定组件 + 构建产物 ─────────────────────────────────
  build:
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.sel.outputs.component }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # release notes 需要完整历史

      # tag 前缀即组件名。唯一的映射点在 tools/release/build.py 的
      # COMPONENTS——新增组件只改那里，本 job 无需改动。
      - name: 由 tag 前缀判定组件
        id: sel
        run: |
          set -euo pipefail
          for c in $(python3 tools/release/build.py --list | awk '{print $1}'); do
            if [[ "$TAG" == "$c"-v* ]]; then echo "component=$c" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "::error::tag $TAG 不匹配任何组件（应为 <component>-v<version>）" >&2
          exit 1

      # 同时校验 tag 版本与包内版本一致、CHANGELOG 有对应段落。
      - name: 构建产物 + 校验版本
        run: python3 tools/release/build.py --component "${{ steps.sel.outputs.component }}" --tag "$TAG"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ steps.sel.outputs.component }}
          path: dist/${{ steps.sel.outputs.component }}/
          retention-days: 7

  # ── 2. 系统包（有打包物料的组件：deb / rpm / pkg.tar）────────
  packaging:
    needs: build
    if: needs.build.outputs.component == 'nosd-gtk-theme' || needs.build.outputs.component == 'fcitx5-theme-nosd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - name: install build deps
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev devscripts debhelper fakeroot rpm

      - name: build deb + rpm
        env:
          COMPONENT: ${{ needs.build.outputs.component }}
          VERSION: ${{ env.TAG }}
        run: |
          set -euo pipefail
          cd "packages/$COMPONENT"
          VER="${VERSION#"$COMPONENT"-v}"
          if [ -d debian ]; then
            dch -v "${VER}-1" "CI build ${VERSION}" || true
            dpkg-buildpackage -us -uc -b
            mkdir -p "$GITHUB_WORKSPACE/dist/$COMPONENT"
            mv ../*.deb "$GITHUB_WORKSPACE/dist/$COMPONENT/" || true
          fi
          if [ -f "rpm/$COMPONENT.spec" ]; then
            : # TODO: rpmbuild 需要源码包布局，见 build-deb；首版先只出 deb/tar
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ needs.build.outputs.component }}
          path: dist/${{ needs.build.outputs.component }}/
          retention-days: 7

  # ── 3. GitHub Release（全部组件）────────────────────────────
  github-release:
    needs: [build, packaging]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-${{ needs.build.outputs.component }}
          path: dist
      - uses: actions/download-artifact@v7
        with:
          pattern: pkg-${{ needs.build.outputs.component }}
          path: dist
        continue-on-error: true

      - name: 创建 / 更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          COMPONENT="${{ needs.build.outputs.component }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "dist/release_notes.md" \
              dist/*
          fi
          echo "::notice::组件 $COMPONENT 发布完成：$TAG"

  # ── 4. reopen development（仅 nosdshell：isDevelopment 回 true）──
  reopen:
    needs: [build, github-release]
    if: needs.build.outputs.component == 'nosdshell'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: isDevelopment 改回 true 并推送
        run: |
          set -euo pipefail
          sed -i 's/isDevelopment: false/isDevelopment: true/' \
            packages/nosdshell/Commons/Version.qml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/nosdshell/Commons/Version.qml
          git commit -m "chore(release): reopen development after $TAG"
          git push origin main
